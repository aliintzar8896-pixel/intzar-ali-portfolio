<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Header Bar -->
  <rect x="40" y="30" width="720" height="50" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <circle cx="70" cy="55" r="7" fill="#ff5f56" />
  <circle cx="95" cy="55" r="7" fill="#ffbd2e" />
  <circle cx="120" cy="55" r="7" fill="#27c93f" />
  <text x="160" y="60" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">JobSphere | Modern Recruitment Portal</text>

  <!-- Search & Filter Area -->
  <rect x="40" y="100" width="720" height="60" rx="12" fill="#141d2f" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" />
  <rect x="60" y="115" width="280" height="30" rx="6" fill="#1e293b" />
  <text x="75" y="135" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">🔍 Search "Full Stack Developer, React, MERN"...</text>
  <rect x="360" y="115" width="160" height="30" rx="6" fill="#1e293b" />
  <text x="375" y="135" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">📍 Remote / Delhi NCR</text>
  <rect x="540" y="115" width="100" height="30" rx="6" fill="#1e293b" />
  <text x="555" y="135" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">💼 Full-time</text>
  <rect x="660" y="115" width="80" height="30" rx="6" fill="url(#primaryGlow)" />
  <text x="680" y="135" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#07090e">Filter</text>

  <!-- Job Cards Row 1 -->
  <!-- Card 1 -->
  <rect x="40" y="180" width="345" height="135" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <circle cx="75" cy="215" r="18" fill="#0284c7" />
  <text x="75" y="220" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">R</text>
  <text x="105" y="212" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Senior Frontend Engineer</text>
  <text x="105" y="228" font-family="'Inter', sans-serif" font-size="12" fill="#38bdf8">Nexus Technologies • Remote</text>
  <rect x="60" y="250" width="60" height="22" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="0.5" />
  <text x="90" y="265" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">React.js</text>
  <rect x="128" y="250" width="70" height="22" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="0.5" />
  <text x="163" y="265" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">TypeScript</text>
  <rect x="206" y="250" width="60" height="22" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="0.5" />
  <text x="236" y="265" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Tailwind</text>
  <rect x="290" y="278" width="80" height="26" rx="6" fill="url(#primaryGlow)" />
  <text x="330" y="295" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#07090e" text-anchor="middle">Apply Now</text>

  <!-- Card 2 -->
  <rect x="415" y="180" width="345" height="135" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <circle cx="450" cy="215" r="18" fill="#7928ca" />
  <text x="450" y="220" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">M</text>
  <text x="480" y="212" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#f8fafc">MERN Stack Specialist</text>
  <text x="480" y="228" font-family="'Inter', sans-serif" font-size="12" fill="#a855f7">Apex Cloud Innovations • Hybrid</text>
  <rect x="435" y="250" width="65" height="22" rx="4" fill="#0f172a" stroke="#7928ca" stroke-width="0.5" />
  <text x="467" y="265" font-family="'Inter', sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">Node.js</text>
  <rect x="508" y="250" width="70" height="22" rx="4" fill="#0f172a" stroke="#7928ca" stroke-width="0.5" />
  <text x="543" y="265" font-family="'Inter', sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">MongoDB</text>
  <rect x="586" y="250" width="65" height="22" rx="4" fill="#0f172a" stroke="#7928ca" stroke-width="0.5" />
  <text x="618" y="265" font-family="'Inter', sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">Express</text>
  <rect x="665" y="278" width="80" height="26" rx="6" fill="url(#accentGlow)" />
  <text x="705" y="295" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ffffff" text-anchor="middle">Apply Now</text>

  <!-- Job Cards Row 2 -->
  <rect x="40" y="335" width="720" height="135" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <circle cx="75" cy="375" r="18" fill="#10b981" />
  <text x="75" y="380" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">F</text>
  <text x="105" y="372" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Full Stack Developer (BCA Fresher / Intern)</text>
  <text x="105" y="390" font-family="'Inter', sans-serif" font-size="12" fill="#34d399">Innovate Labs • Noida, India</text>
  <rect x="60" y="410" width="70" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.5" />
  <text x="95" y="425" font-family="'Inter', sans-serif" font-size="10" fill="#34d399" text-anchor="middle">JavaScript</text>
  <rect x="138" y="410" width="60" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.5" />
  <text x="168" y="425" font-family="'Inter', sans-serif" font-size="10" fill="#34d399" text-anchor="middle">REST APIs</text>
  <rect x="206" y="410" width="60" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.5" />
  <text x="236" y="425" font-family="'Inter', sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Git / PRs</text>
  <rect x="660" y="405" width="85" height="30" rx="6" fill="url(#primaryGlow)" />
  <text x="702" y="425" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#07090e" text-anchor="middle">Apply</text>
</svg>
