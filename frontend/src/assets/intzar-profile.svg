<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#1a274e" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="200" fill="url(#avatarBg)" />

  <!-- Outer Cyber Rings -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.4" />

  <!-- Center Stylized Developer Silhouette & Code Symbol -->
  <g transform="translate(100, 70)" filter="url(#softGlow)">
    <!-- Head / Brain Concept -->
    <circle cx="100" cy="80" r="46" fill="#1e293b" stroke="url(#neonCyan)" stroke-width="3" />
    
    <!-- Code Bracket Symbol Inside Head -->
    <path d="M85 65 L70 80 L85 95" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M115 65 L130 80 L115 95" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M104 62 L96 98" fill="none" stroke="#4facfe" stroke-width="3" stroke-linecap="round" />

    <!-- Developer Shoulders & Body -->
    <path d="M20 220 C20 150, 60 140, 100 140 C140 140, 180 150, 180 220 Z" fill="#0f172a" stroke="url(#neonPurple)" stroke-width="3" />

    <!-- Laptop / Terminal Shape in Front -->
    <path d="M40 200 L160 200 L150 240 L50 240 Z" fill="#1e293b" stroke="url(#neonCyan)" stroke-width="2" />
    <line x1="70" y1="215" x2="130" y2="215" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
    <circle cx="100" cy="228" r="4" fill="#00f2fe" />
  </g>

  <!-- Developer Badge / Monogram Pill -->
  <g transform="translate(110, 320)">
    <rect width="180" height="42" rx="21" fill="#07090e" stroke="url(#neonCyan)" stroke-width="1.5" />
    <text x="90" y="26" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#00f2fe" letter-spacing="2">INTZAR ALI</text>
  </g>
</svg>
