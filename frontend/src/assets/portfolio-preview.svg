<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#portBg)" />
  <circle cx="200" cy="180" r="220" fill="url(#glowCyan)" />
  <circle cx="650" cy="350" r="250" fill="url(#glowPurple)" />

  <!-- Constellation Nodes & Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.6">
    <line x1="120" y1="80" x2="240" y2="140" stroke="#00f2fe" stroke-opacity="0.3" />
    <line x1="240" y1="140" x2="310" y2="90" stroke="#00f2fe" stroke-opacity="0.3" />
    <line x1="580" y1="100" x2="690" y2="160" stroke="#a855f7" stroke-opacity="0.3" />
    <line x1="690" y1="160" x2="740" y2="280" stroke="#a855f7" stroke-opacity="0.3" />
    <line x1="100" y1="360" x2="210" y2="420" stroke="#00f2fe" stroke-opacity="0.2" />
    <circle cx="120" cy="80" r="3" fill="#00f2fe" />
    <circle cx="240" cy="140" r="2.5" fill="#4facfe" />
    <circle cx="310" cy="90" r="3" fill="#00f2fe" />
    <circle cx="580" cy="100" r="3" fill="#a855f7" />
    <circle cx="690" cy="160" r="3.5" fill="#ec4899" />
    <circle cx="740" cy="280" r="2.5" fill="#a855f7" />
  </g>

  <!-- Top Navigation Mockup -->
  <rect x="40" y="24" width="720" height="48" rx="14" fill="url(#glassCard)" stroke="#334155" stroke-width="1" />
  <rect x="56" y="36" width="24" height="24" rx="6" fill="#00f2fe" fill-opacity="0.2" stroke="#00f2fe" stroke-width="1" />
  <text x="68" y="52" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00f2fe" text-anchor="middle">&gt;_</text>
  <text x="92" y="52" font-family="'Outfit', sans-serif" font-weight="800" font-size="15" fill="#f8fafc">Intzar <tspan fill="#00f2fe">Ali</tspan></text>
  <text x="380" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">HOME • ABOUT • JOURNEY • SKILLS • PROJECTS • CONTACT</text>
  <rect x="670" y="34" width="75" height="28" rx="8" fill="url(#cyanGrad)" />
  <text x="707" y="52" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#07090e" text-anchor="middle">Story 3D</text>

  <!-- Hero Content Left -->
  <rect x="50" y="100" width="180" height="26" rx="13" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.4" />
  <circle cx="64" cy="113" r="3.5" fill="#34d399" />
  <text x="76" y="117" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Available for Internships</text>

  <text x="50" y="160" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Hi, I'm <tspan fill="#38bdf8" font-weight="700">Intzar Ali</tspan></text>
  <text x="50" y="200" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-1">Full Stack Developer</text>
  <text x="50" y="235" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="url(#cyanGrad)">GSAP Cinematic Experience</text>

  <text x="50" y="275" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">BCA Full Stack scholar crafting modern reactive web apps with</text>
  <text x="50" y="295" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">smooth ScrollTrigger timelines and fluid 3D parallax physics.</text>

  <!-- Action Badges -->
  <rect x="50" y="325" width="130" height="38" rx="10" fill="url(#cyanGrad)" />
  <text x="115" y="349" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#07090e" text-anchor="middle">Explore Work →</text>
  <rect x="190" y="325" width="130" height="38" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="255" y="349" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Interactive 3D</text>

  <!-- GSAP Feature Pills -->
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#00f2fe" stroke-opacity="0.3" />
    <text x="52" y="18" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00f2fe" text-anchor="middle">⚡ GSAP 3.15</text>
    <rect x="115" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.3" />
    <text x="177" y="18" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">📜 ScrollTrigger</text>
    <rect x="250" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" />
    <text x="307" y="18" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">🎯 3D Parallax</text>
  </g>

  <!-- Right Side: 3D Holographic Card & Avatar Simulation -->
  <g transform="translate(480, 110)">
    <!-- Rotating Ring 1 -->
    <ellipse cx="140" cy="150" rx="135" ry="135" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
    <!-- Rotating Ring 2 -->
    <ellipse cx="140" cy="150" rx="155" ry="155" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="14 10" opacity="0.4" />
    
    <!-- Central Glowing Sphere / Portrait Container -->
    <circle cx="140" cy="150" r="115" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="3" filter="drop-shadow(0 0 25px rgba(0,242,254,0.4))" />
    <circle cx="140" cy="150" r="105" fill="#111827" />

    <!-- Stylized Avatar Silhouette in Suit -->
    <circle cx="140" cy="115" r="38" fill="#334155" />
    <path d="M75,230 C75,175 110,165 140,165 C170,165 205,175 205,230 Z" fill="#1e293b" />
    <!-- Tie -->
    <polygon points="137,175 143,175 146,215 140,225 134,215" fill="#ef4444" />
    <!-- Collar -->
    <polygon points="120,165 137,185 133,165" fill="#ffffff" />
    <polygon points="160,165 143,185 147,165" fill="#ffffff" />

    <!-- Floating Badge 1 -->
    <rect x="-10" y="60" width="115" height="34" rx="10" fill="url(#glassCard)" stroke="#00f2fe" stroke-width="1" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <circle cx="10" cy="77" r="4" fill="#00f2fe" />
    <text x="24" y="81" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">MERN Stack</text>

    <!-- Floating Badge 2 -->
    <rect x="170" y="230" width="125" height="34" rx="10" fill="url(#glassCard)" stroke="#a855f7" stroke-width="1" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <circle cx="190" cy="247" r="4" fill="#a855f7" />
    <text x="202" y="251" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">TMU • BCA 5th</text>
  </g>
</svg>
